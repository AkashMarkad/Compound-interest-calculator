<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2&display=swap" rel="stylesheet">
     
    <title>Compound Interest Calculator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <h1 class="title center"><b>Compound Interest Calculator</b></h1>
      <header>
        <div class="row">
          <div class="container m-auto">
            <div class="dev bg-devc responsive">
              <div class="card w-100 m-auto text-center responsive">
                <div class="card-body">
                  <form action="" class="form-inline w-100 center">
                    <div class="form-group">
                      <input type="text" class="form-control text-center" placeholder="P (Principal)" id="p">
                    </div>
                    <div class="pl-4 pr-4"></div>
                    <div class="form-group"> 
                      <input type="text" class="form-control text-center" placeholder="R (Rate %)" id="r">
                    </div>
                    <div class="pl-4 pr-4"></div>
                    <div class="form-group"> 
                      <input type="text" class="form-control text-center" placeholder="N (Compounded/year)" id="n">
                    </div>
                    <div class="pl-4 pr-4"></div>
                    <div class="form-group"> 
                      <input type="text" class="form-control text-center" placeholder="T (Years)" id="t">
                    </div>
                  </form><br>
                  <div class="w-100 m-auto">
                    <button class="btn btn-danger w-100 responsive center" onclick="compoundInterest()">Calculate</button>
                  </div>
                  <br>
                  <div>
                    <input type="text" placeholder="Total Amount (A)" class="form-control text-center w-100 m-auto center" id="Ans" readonly>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>
      <p class="element center">
        A = final amount <br>
        P = initial principal balance <br>
        r = annual interest rate (%) <br>
        n = number of times interest applied per year <br>
        t = number of years
      </p>
    </div>

    <script>
      function compoundInterest() {
        let p = parseFloat(document.getElementById('p').value);
        let r = parseFloat(document.getElementById('r').value);
        let n = parseFloat(document.getElementById('n').value);
        let t = parseFloat(document.getElementById('t').value);

        if (isNaN(p) || isNaN(r) || isNaN(n) || isNaN(t)) {
          alert("Please enter valid numbers in all fields.");
          return;
        }

        // Formula: A = P * (1 + r / (100 * n))^(n * t)
        let A = p * Math.pow((1 + r / (100 * n)), n * t);
        document.getElementById("Ans").value = A.toFixed(2);
      }
    </script>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
